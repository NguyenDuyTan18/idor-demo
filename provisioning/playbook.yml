- name: Record the identity of each sandbox host for later battle-network verification
  hosts: hosts
  become: true
  gather_facts: false
  tasks:
    - name: Require the sandbox UUID provided by the platform
      ansible.builtin.assert:
        that:
          - global_sandbox_id is defined
          - global_sandbox_id | length == 36
    - name: Store the local sandbox and host identity
      ansible.builtin.copy:
        dest: /etc/idor-free-lab-identity.json
        owner: root
        group: root
        mode: '0644'
        content: '{{ dict(sandbox_uuid=global_sandbox_id, role=inventory_hostname) | to_nice_json }}'

- name: Build an independent ServiceDesk instance
  hosts: web
  become: true
  gather_facts: true
  tasks:
    - name: Require a platform sandbox identity
      ansible.builtin.assert:
        that:
          - global_sandbox_id is defined or global_sandbox_name is defined
          - lab_web_password | length > 0

    - name: Install Python only
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create unprivileged service account
      ansible.builtin.user:
        name: free-lab-web
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application and config directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: free-lab-web
        mode: '0750'
      loop: [/opt/idor-free-lab, /etc/idor-free-lab]

    - name: Create the database directory on this web VM
      ansible.builtin.file:
        path: /var/lib/idor-free-lab
        state: directory
        owner: free-lab-web
        group: free-lab-web
        mode: '0700'

    - name: Deploy the new helpdesk application
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../app/{{ item }}'
        dest: '/opt/idor-free-lab/{{ item }}'
        owner: root
        group: free-lab-web
        mode: '0640'
      loop: [portal.py, portal.html]
      notify: Restart free lab web

    - name: Store per-sandbox application settings
      ansible.builtin.copy:
        dest: /etc/idor-free-lab/config.json
        owner: root
        group: free-lab-web
        mode: '0640'
        content: >-
          {{ dict(database='/var/lib/idor-free-lab/tickets.sqlite',
          password=lab_web_password,
          sandbox_id=global_sandbox_id | default(global_sandbox_name | default('')),
          enforce_owner=lab_enforce_owner | bool) | to_nice_json }}
      no_log: true
      notify: Restart free lab web

    - name: Install service definition
      ansible.builtin.copy:
        src: servicedesk.service
        dest: /etc/systemd/system/servicedesk.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart free lab web

    - name: Start ServiceDesk
      ansible.builtin.systemd_service:
        name: servicedesk
        daemon_reload: true
        enabled: true
        state: started

    - ansible.builtin.meta: flush_handlers

    - name: Verify web locally
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        use_proxy: false
      register: local_health
      until: local_health.status | default(0) == 200
      retries: 10
      delay: 3
  handlers:
    - name: Restart free lab web
      ansible.builtin.systemd_service:
        name: servicedesk
        daemon_reload: true
        state: restarted

- name: Configure the trainee's own Kali
  hosts: kali
  become: true
  gather_facts: true
  vars:
    user_access_username: user-access
    user_access_password: '{{ lab_console_password }}'
    user_access_shell: /bin/bash
    user_access_sudo: false
    user_access_ssh_public_key: '{{ global_ssh_public_user_key }}'
  pre_tasks:
    - name: Require the public key generated for this sandbox
      ansible.builtin.assert:
        that:
          - global_ssh_public_user_key is defined
          - global_ssh_public_user_key | length > 0

    - name: Install access and HTTP tools
      ansible.builtin.apt:
        name: [openssh-server, curl, jq]
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: user-access
      no_log: true
  tasks:
    - name: Read drop-ins before the image's defaults
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        insertbefore: BOF
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Reload free lab SSH

    - name: Enable console and SSH key access for the trainee
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-free-lab.conf
        mode: '0644'
        owner: root
        group: root
        content: |
          Match User user-access
              PasswordAuthentication yes
              PubkeyAuthentication yes
              AuthenticationMethods any
              AllowTcpForwarding yes
          Match all
      notify: Reload free lab SSH

    - name: Ensure account and shell remain usable
      ansible.builtin.user:
        name: user-access
        shell: /bin/bash
        expires: -1
        password_expire_max: -1

    - name: Validate SSH syntax
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - ansible.builtin.meta: flush_handlers

    - name: Check effective trainee SSH settings
      ansible.builtin.command: /usr/sbin/sshd -T -C user=user-access,host=kali,addr=127.0.0.1
      register: ssh_settings
      changed_when: false

    - name: Require console password and trainee public key support
      ansible.builtin.assert:
        that:
          - "'passwordauthentication yes' in ssh_settings.stdout_lines"
          - "'pubkeyauthentication yes' in ssh_settings.stdout_lines"
          - "'authenticationmethods any' in ssh_settings.stdout_lines"

    - name: Check this Kali can reach its own web
      ansible.builtin.uri:
        url: http://10.80.0.20:8080/health
        use_proxy: false
        return_content: true
      register: kali_health
      until: kali_health.status | default(0) == 200
      retries: 10
      delay: 3
  handlers:
    - name: Reload free lab SSH
      ansible.builtin.service:
        name: ssh
        enabled: true
        state: reloaded
