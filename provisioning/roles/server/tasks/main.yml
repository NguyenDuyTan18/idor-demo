- name: Require a real platform APG answer and sandbox identity
  ansible.builtin.assert:
    that:
      - idor_flag is defined
      - idor_flag | length >= 24
      - global_sandbox_id is defined or global_sandbox_name is defined
      - idor_web_password | length > 0
    fail_msg: 'APG inventory is missing. Enable variant sandboxes; never substitute a shared static flag.'
  no_log: true

- name: Create an unprivileged web service account
  ansible.builtin.user:
    name: idor-lab
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create web and configuration directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: idor-lab
    mode: '0750'
  loop:
    - '{{ idor_install_dir }}'
    - '{{ idor_config_dir }}'

- name: Copy the standard-library web implementation
  ansible.builtin.copy:
    src: idor_app.py
    dest: '{{ idor_install_dir }}/idor_app.py'
    owner: root
    group: idor-lab
    mode: '0640'
  notify: Restart IDOR web

- name: Write this sandbox's APG configuration without exposing answers in logs
  ansible.builtin.copy:
    dest: '{{ idor_config_dir }}/config.json'
    owner: root
    group: idor-lab
    mode: '0640'
    content: >-
      {{ dict(flag=idor_flag, password=idor_web_password,
      enforce_owner=idor_enforce_owner | bool,
      sandbox_id=global_sandbox_id | default(global_sandbox_name | default(''))) | to_nice_json }}
  no_log: true
  notify: Restart IDOR web

- name: Install the web service
  ansible.builtin.template:
    src: idor-lab.service.j2
    dest: /etc/systemd/system/idor-lab.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart IDOR web

- name: Enable web service
  ansible.builtin.systemd_service:
    name: idor-lab
    daemon_reload: true
    enabled: true
    state: started

- name: Apply changed app and APG settings before health check
  ansible.builtin.meta: flush_handlers

- name: Check web service locally
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ idor_web_port }}/health'
    return_content: true
    use_proxy: false
  register: idor_server_health
  until: idor_server_health.status | default(0) == 200
  retries: 10
  delay: 3
