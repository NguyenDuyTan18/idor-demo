# Run separately AFTER pool allocation, using both downloaded management configs.
# This is an instructor operation, not a Sandbox Service per-sandbox playbook.
- name: Validate experiment inventory before touching any machine
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require exactly one hub and the four lab VM endpoints
      ansible.builtin.assert:
        that:
          - groups['lab_hub'] | length == 1
          - groups['lab_peers'] | length == 4
          - "'example.org' not in idor_hub_endpoint"
          - "idor_hub_endpoint is match('^[A-Za-z0-9.-]+:51820$')"
          - "'/absolute/path/' not in (hostvars[item].ansible_ssh_common_args | default(''))"
          - idor_overlay_cidr == '10.200.0.0/24'
          - idor_hub_ip == '10.200.0.1'
          - idor_hub_port | int == 51820
        fail_msg: 'Fill inventory.yml with the existing hub and real pool management configs. This design reserves 10.200.0.0/24.'
      loop: "{{ groups['lab_peers'] }}"

    - name: Require four distinct endpoint identities
      ansible.builtin.assert:
        that:
          - >-
            groups['lab_peers'] | map('extract', hostvars, 'idor_overlay_ip') | sort | list
            == ['10.200.0.11', '10.200.0.12', '10.200.0.21', '10.200.0.22']

- name: Install tunnel tools and create persistent keys locally on each endpoint
  hosts: lab_hub:lab_peers
  become: true
  gather_facts: true
  tasks:
    - name: Require Linux endpoints
      ansible.builtin.assert:
        that: ansible_system == 'Linux'

    - name: Install WireGuard and firewall tools
      ansible.builtin.apt:
        name: [wireguard-tools, iptables, iputils-ping]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Require kernel support for WireGuard
      ansible.builtin.command: modprobe wireguard
      changed_when: false

    - name: Reject overlay routes that overlap an existing non-tunnel network
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress, json, subprocess, sys
            overlay = ipaddress.ip_network('10.200.0.0/24')
            routes = json.loads(subprocess.check_output(['ip', '-j', '-4', 'route', 'show', 'table', 'all']))
            conflicts = []
            for route in routes:
                destination = route.get('dst', 'default')
                if destination == 'default' or route.get('dev') == 'wg-idor':
                    continue
                network = ipaddress.ip_network(destination, strict=False)
                if network.prefixlen and network.overlaps(overlay):
                    conflicts.append(destination)
            if conflicts:
                sys.exit('Overlay overlaps existing routes: ' + ', '.join(conflicts))
      changed_when: false

    - name: Protect the tunnel configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Check for this endpoint's persistent key
      ansible.builtin.stat:
        path: /etc/wireguard/idor-lab.key
      register: idor_key_stat

    - name: Generate a private key only on first setup
      ansible.builtin.command: wg genkey
      register: idor_key_generated
      when: not idor_key_stat.stat.exists
      no_log: true

    - name: Save the private key with restrictive permissions
      ansible.builtin.copy:
        content: "{{ idor_key_generated.stdout }}\n"
        dest: /etc/wireguard/idor-lab.key
        owner: root
        group: root
        mode: '0600'
      when: not idor_key_stat.stat.exists
      no_log: true

    - name: Read key for rendering without printing it
      ansible.builtin.slurp:
        src: /etc/wireguard/idor-lab.key
      register: idor_wg_private
      no_log: true

    - name: Derive the public key for the peer table
      ansible.builtin.command:
        argv: [wg, pubkey]
        stdin: '{{ idor_wg_private.content | b64decode | trim }}'
      register: idor_wg_public
      changed_when: false
      no_log: true

- name: Configure the dedicated experiment hub
  hosts: lab_hub
  become: true
  gather_facts: false
  tasks:
    - name: Enable packet forwarding on the hub only
      ansible.builtin.copy:
        content: "net.ipv4.ip_forward=1\n"
        dest: /etc/sysctl.d/70-idor-lab.conf
        owner: root
        group: root
        mode: '0644'

    - name: Load the dedicated forwarding setting
      ansible.builtin.command: sysctl -p /etc/sysctl.d/70-idor-lab.conf
      changed_when: false

    - name: Install the four-peer hub configuration
      ansible.builtin.template:
        src: templates/hub.conf.j2
        dest: /etc/wireguard/wg-idor.conf
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: Restart IDOR hub tunnel

    - name: Start the hub tunnel
      ansible.builtin.systemd_service:
        name: wg-quick@wg-idor
        enabled: true
        state: started

    - ansible.builtin.meta: flush_handlers
  handlers:
    - name: Restart IDOR hub tunnel
      ansible.builtin.systemd_service:
        name: wg-quick@wg-idor
        state: restarted

- name: Attach both Kali and both web VMs to the experiment network
  hosts: lab_peers
  become: true
  gather_facts: false
  tasks:
    - name: Install the endpoint-specific tunnel configuration
      ansible.builtin.template:
        src: templates/peer.conf.j2
        dest: /etc/wireguard/wg-idor.conf
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: Restart IDOR peer tunnel

    - name: Start the peer tunnel
      ansible.builtin.systemd_service:
        name: wg-quick@wg-idor
        enabled: true
        state: started

    - ansible.builtin.meta: flush_handlers

    - name: Check ping to the other sandbox's Kali
      ansible.builtin.command: 'ping -c 2 -W 3 {{ idor_other_attacker_ip }}'
      register: idor_remote_ping
      changed_when: false
      until: idor_remote_ping.rc == 0
      retries: 10
      delay: 3

    - name: Check HTTP to the other sandbox's web service
      ansible.builtin.uri:
        url: 'http://{{ idor_other_server_ip }}:8080/health'
        return_content: true
        use_proxy: false
      register: idor_remote_web
      until: idor_remote_web.status | default(0) == 200
      retries: 10
      delay: 3

    - name: Read local web identity for server comparison
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        return_content: true
        use_proxy: false
      register: idor_local_web
      when: idor_peer_kind == 'server'

    - name: Verify this is the other sandbox rather than our duplicate private IP
      ansible.builtin.assert:
        that:
          - idor_remote_web.json.sandbox != idor_local_web.json.sandbox
      when: idor_peer_kind == 'server'
  handlers:
    - name: Restart IDOR peer tunnel
      ansible.builtin.systemd_service:
        name: wg-quick@wg-idor
        state: restarted
